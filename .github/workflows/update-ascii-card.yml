name: Update ASCII profile card

on:
  schedule:
    # Runs once a day at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch latest card
        run: |
          curl -fL "https://gh.crafter.run/Aditya-Sharma-dev18?theme=dark&cols=140" -o dark_mode.svg

      - name: Inject blinking cursor + fade-in animation
        run: python3 scripts/inject_cursor.py dark_mode.svg

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- dark_mode.svg; then
            git add dark_mode.svg
            git commit -m "chore: refresh ascii profile card [automated]"
            git push
          else
            echo "No changes to card, skipping commit."
          fi
